name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore packages
        run: nuget restore .\mwb-materials\mwb-materials.sln

      - name: Build Release
        run: >
          msbuild .\mwb-materials\mwb-materials.sln
          /m
          /p:Configuration=Release
          /p:GenerateResourceMSBuildArchitecture=CurrentArchitecture
          /p:GenerateResourceMSBuildRuntime=CurrentRuntime

      - name: Upload Release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwb-materials-release
          path: .\mwb-materials\bin\Release\
